# Ported from lee-to ai-factory (tests/without-plan-broad-scope-redirects.yaml),
# adapted to Hermes: the redirect target is planning via the aif-plan skill /
# aif_planner role instead of `/aif-plan fast`; an autonomous worker blocks the
# task (needs planning) rather than printing advice to a user. Spec-style
# fixture — no Hermes runner consumes it yet.
scenario: without-plan-broad-scope-redirects
description: |
  Inline mode has a scope guard: broad / multi-subsystem / multi-imperative
  descriptions must be redirected to planning (skill `aif-plan`, role
  aif_planner) instead of attempting a one-shot implementation — aif-implement
  handles exactly ONE task or one tightly-coupled group per cycle and never
  silently expands scope.

  The description here deliberately chains multiple unrelated imperatives
  across subsystems (auth, billing, analytics dashboards, admin UI, seed data,
  migrations) and is far beyond a single scoped task, so the guard should fire.

  Verifies:
  (1) the skill's output names `aif-plan` (or the aif_planner role) as the
      redirect target — in worker mode this is a kanban block/handoff with
      "needs planning" as the reason;
  (2) no file is created / modified (no Write, no Edit) — the skill stops
      before executing anything;
  (3) no plan / fix / patch artifacts are written;
  (4) the skill does NOT silently fall into full execution.
skill: aif-implement
argument: >-
  Inline task (no plan): add JWT-based authentication with refresh tokens and
  session revocation across the api and web app, introduce a Stripe-backed
  billing subsystem with subscription plans and usage metering, build a
  real-time analytics dashboard with websocket streams and historical
  aggregation, ship a new admin UI for user and feature-flag management, seed
  the database with realistic demo data, and write the migrations for all the
  new tables plus a rollout guide
max_turns: 20

runner:
  model: claude-sonnet-4-6
  permission_mode: bypassPermissions
  allowed_tools_override:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Bash(git *)
    - Bash(ls *)
    - Bash(pwd)
    - Bash(basename *)
    - Bash(cd *)
    - Bash(printenv *)
    - Bash(hermes kanban *)

fixtures:
  git_init: true
  git_branch: main
  files_committed:
    - path: README.md
      content: |
        # Demo repo

        Minimal fixture repo for the aif-implement inline-mode scope-guard scenario.
    - path: package.json
      content: |
        {
          "name": "demo",
          "version": "0.1.0"
        }

user_responses: []

assertions:
  # Skill must surface planning as the redirect target.
  - id: redirects-to-aif-plan
    type: output_contains
    pattern: "(?i)aif[-_]plan"
    weight: 3

  # Skill must signal this is a scope problem (not a silent stop).
  - id: explains-scope-redirect
    type: output_contains
    pattern: "(?i)broad|too\\s+large|scope"
    weight: 1

  # The skill must not start implementing anything — no Write.
  - id: no-write-any-file
    type: no_tool_called
    tool: Write

  # No Edit either.
  - id: no-edit-any-file
    type: no_tool_called
    tool: Edit

  # No plan / fix / patch artifacts.
  - id: no-plan-artifacts-written
    type: no_tool_called
    tool: Write
    args_match:
      file_path: "\\.hermes-dev/(plans|fixes|patches)/"

  - id: stay-in-sandbox
    type: no_path_escape
