# Ported from lee-to ai-factory (tests/sequential-plan-discovery.yaml), adapted
# to Hermes: the sequential rule lives in .hermes-dev/RULES.md (no config.yaml);
# discovery applies when the kanban handoff names NO plan path (a handoff-named
# plan always wins — see references/IMPLEMENTATION-GUIDE.md). Spec-style
# fixture — no Hermes runner consumes it yet.
scenario: sequential-plan-discovery
description: |
  With the sequential-prefix project rule active and multiple numbered plan
  files matching the current branch stem, aif-implement (no plan named in the
  handoff) must:

    1. Glob `.hermes-dev/plans/[0-9][0-9][0-9][0-9]_<branch-slug>.md` first
       (branch stem = `git branch --show-current` with `/` replaced by `-`).
    2. Pick the **highest-numbered** match for the current branch's stem.
    3. Emit `WARN [aif-implement] multiple sequential plans for <branch>: ...`
       when more than one match exists.
    4. Not touch numbered plans whose stem belongs to a different branch.

  Fixture state:
    Current branch:                       feature/user-auth
    Branch-derived stem:                  feature-user-auth
    .hermes-dev/plans/0001_feature-user-auth.md   (this branch, OLDER)
    .hermes-dev/plans/0005_feature-user-auth.md   (this branch, HIGHEST → chosen)
    .hermes-dev/plans/0003_other-feature.md       (different stem — ignored)

  The chosen plan (`0005_*`) contains one Write-tool task with a distinct
  output filename so the assertion can verify which plan was executed.
skill: aif-implement
argument: ""
max_turns: 50

runner:
  model: claude-sonnet-4-6
  permission_mode: bypassPermissions
  allowed_tools_override:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Bash(git *)
    - Bash(mkdir *)
    - Bash(ls *)
    - Bash(pwd)
    - Bash(basename *)
    - Bash(cd *)
    - Bash(printenv *)
    - Bash(hermes kanban *)

fixtures:
  git_init: true
  git_branch: feature/user-auth
  files_committed:
    - path: README.md
      content: |
        # Demo repo

        Fixture for sequential plan discovery in aif-implement.
    - path: package.json
      content: |
        {
          "name": "demo",
          "version": "0.1.0"
        }
    - path: .hermes-dev/RULES.md
      content: |
        # Project rules

        - Plan files use a 4-digit sequential prefix: `NNNN_<slug>.md`.
    - path: .hermes-dev/plans/0001_feature-user-auth.md
      content: |
        # Feature: user-auth (older plan)

        ## Settings
        - Testing: no
        - Logging: no
        - Docs: no

        ## Tasks

        - [ ] Task 1: Use the `Write` tool to create `OLDER_PLAN_RAN.txt` at the repo root with the text `older`. (This task must NOT execute — the higher-numbered plan should win.)
    - path: .hermes-dev/plans/0005_feature-user-auth.md
      content: |
        # Feature: user-auth (latest plan)

        ## Settings
        - Testing: no
        - Logging: no
        - Docs: no

        ## Tasks

        - [ ] Task 1: Use the `Write` tool to create `LATEST_PLAN_RAN.txt` at the repo root containing exactly the text `latest` (no trailing newline). Do not use Bash to echo/printf the file — the test asserts the Write tool call.
    - path: .hermes-dev/plans/0003_other-feature.md
      content: |
        # Feature: other-feature (different branch stem — must be ignored)

        ## Tasks

        - [ ] Task 1: Use the `Write` tool to create `OTHER_PLAN_RAN.txt` at the repo root with the text `other`. (This file's stem does not match the current branch and must NOT execute.)

user_responses: []

assertions:
  - id: reads-highest-numbered-plan
    type: tool_called
    tool: Read
    args_match:
      file_path: "\\.hermes-dev/plans/0005_feature-user-auth\\.md$"
    weight: 4

  - id: does-not-execute-older-plan
    type: no_tool_called
    tool: Write
    args_match:
      file_path: "(^|/)OLDER_PLAN_RAN\\.txt$"

  - id: does-not-execute-other-stem-plan
    type: no_tool_called
    tool: Write
    args_match:
      file_path: "(^|/)OTHER_PLAN_RAN\\.txt$"

  - id: writes-latest-output
    type: tool_called
    tool: Write
    args_match:
      file_path: "(^|/)LATEST_PLAN_RAN\\.txt$"
      content: "latest"
    weight: 3

  - id: warns-about-multiple-sequential-plans
    type: output_contains
    pattern: "(?i)WARN \\[aif-implement\\] multiple sequential plans"
    weight: 2

  - id: updates-chosen-plan-checkbox
    type: tool_called
    tool: Edit
    args_match:
      file_path: "\\.hermes-dev/plans/0005_feature-user-auth\\.md$"
      new_string: "- \\[x\\]"
    weight: 2

  - id: stay-in-sandbox
    type: no_path_escape
