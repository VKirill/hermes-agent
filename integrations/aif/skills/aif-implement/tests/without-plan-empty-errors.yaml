# Ported from lee-to ai-factory (tests/without-plan-empty-errors.yaml), adapted
# to Hermes: an empty `--without-plan` CLI argument becomes an inline task with
# an empty scope. The autonomous worker blocks with "empty scope / missing
# input" instead of printing lee-to's `Usage: /aif-implement --without-plan`
# text. Spec-style fixture — no Hermes runner consumes it yet.
scenario: without-plan-empty-errors
description: |
  Inline mode must reject an empty task scope (no description, no plan in the
  workspace, no parent handoff) by blocking with the exact missing input, and
  must NOT proceed to execute anything (no Write, no Edit, no plan artifacts).

  Verifies:
  (1) the skill's output names the empty/missing scope as the reason
      (worker mode: kanban block with that reason);
  (2) no file is created or modified;
  (3) no plan/fix artifact is created.
skill: aif-implement
argument: "Inline task (no plan):"
max_turns: 20

runner:
  model: claude-sonnet-4-6
  permission_mode: bypassPermissions
  allowed_tools_override:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Bash(git *)
    - Bash(ls *)
    - Bash(pwd)
    - Bash(basename *)
    - Bash(cd *)
    - Bash(printenv *)
    - Bash(hermes kanban *)

fixtures:
  git_init: true
  git_branch: main
  files_committed:
    - path: README.md
      content: |
        # Demo repo

        Minimal fixture repo for the aif-implement inline-mode empty-arg scenario.
    - path: package.json
      content: |
        {
          "name": "demo",
          "version": "0.1.0"
        }

user_responses: []

assertions:
  # The skill must name the empty/missing scope as the blocker.
  - id: reports-empty-scope
    type: output_contains
    pattern: "(?i)(empty|missing).{0,40}(scope|description|task|input)"
    weight: 3

  # No Write of any file should occur.
  - id: no-write-any-file
    type: no_tool_called
    tool: Write

  # No Edit of any file should occur.
  - id: no-edit-any-file
    type: no_tool_called
    tool: Edit

  # Explicitly: no plan/fix/patch artifacts.
  - id: no-plan-artifacts-written
    type: no_tool_called
    tool: Write
    args_match:
      file_path: "\\.hermes-dev/(plans|fixes|patches)/"

  - id: stay-in-sandbox
    type: no_path_escape
